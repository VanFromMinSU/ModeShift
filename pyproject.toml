[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeshift"
version = "0.1.0"
description = "A Windows CLI utility for switching system settings between optimized usage profiles."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "psutil==7.0.0",
]

[project.scripts]
modeshift = "modeshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]